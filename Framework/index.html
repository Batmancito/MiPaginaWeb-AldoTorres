<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Framework visual</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">.
</head>

<body>
    <section class="hero is-primary is-medium">
        <div class="hero-body">
            <p class="title">
                Vaso de leche
            </p>
            <p class="subtitle">
                Y galletas
            </p>
        </div>
    </section>
    
    <section class="section">
        <div class="columns">
            <div class="column">
                <p class="title is-5">Leche</p>
                <img src="pngtree-glass-of-milk-with-splash-isolated-on-transparent-or-white-background-png-image_20116630.png" alt="Leche">
            </div>
            <div class="column">
                <p class="title is-5">Galletas</p>
                <img src="8_7718a0a9-0404-43b6-b8c6-fb0a05a56eec.png.webp" alt="Galletas">
            </div>
            <div class="column">
                <div class="column">
                    <div class="card">
                        <div class="card-image">
                            <figure class="image is-4by3">
                                <img src="batman-full.BEpAY7Gd_1BVPr3.png" alt="Batman Lego">
                            </figure>
                        </div>
                        <div class="card-content">
                            <p class="title is-5">Batman Lego</p>
                            <p class="content">
                                La noche, la venganza, la justicia, el caballero oscuro. Y las galletas con leche.
                            </p>
                            <button class="button is-primary">Ver más</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
